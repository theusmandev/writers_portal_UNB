    <script type="text/javascript">
      // Restores the original path mapped by 404.html
      (function (l) {
        if (l.search[1] === "p" && l.search[2] === "=") {
          var q = {};
          l.search
            .slice(1)
            .split("&")
            .forEach(function (v) {
              var a = v.split("=");
              q[a[0]] = a.slice(1).join("=").replace(/~and~/g, "&");
            });
          if (q.p !== undefined) {
            window.history.replaceState(
              null,
              null,
              l.pathname.slice(0, -1) + (q.p || "") + (q.q ? "?" + q.q : "") + l.hash,
            );
          }
        }
      })(window.location);
    </script>
