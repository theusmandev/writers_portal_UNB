<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Urdu Novel Bank — Writer & Publication Portal</title>
    <meta name="description" content="Submit, review and track Urdu novels with Urdu Novel Bank's official writer portal." />
    <meta name="author" content="Urdu Novel Bank" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Gulzar&display=swap" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <script type="text/javascript">
      // Restores the original path mapped by 404.html
      (function(l) {
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var a = l.search.slice(3).split('&')[0].replace(/~and~/g, '&').split('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + a[0] + (a[1] ? '?' + a[1] : '') + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
